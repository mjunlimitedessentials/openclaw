services:
  - type: web
    name: jarvis-2
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      # Password you'll use to log into the JARVIS web control panel (set at deploy).
      - key: SETUP_PASSWORD
        sync: false
      # Your Claude key (sk-ant-...). Set it in the Render dashboard — never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: Telegram bot token (from @BotFather) so you can chat with JARVIS.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional: premium butler voice (ElevenLabs). Leave unset to use free voice.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
